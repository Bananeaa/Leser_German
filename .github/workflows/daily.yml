name: Fetch articles daily

on:
  schedule:
    - cron: '0 6 * * *'   # runs every day at 06:00 UTC (08:00 Zurich)
  workflow_dispatch:        # lets you trigger it manually too

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install feedparser

      - run: python fetch_articles.py

      - name: Commit updated articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.json
          git diff --staged --quiet || git commit -m "Daily article update $(date -u +%Y-%m-%d)"
          git push
