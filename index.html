<script>
/* ── Base dictionary (grammar words always available) ── */
const BASE_DICT = {

};

/* ── Wiktionary dictionary (injected by fetch_articles.py) ── */
const WIKT_DICT = {};

/* ── Articles (loaded from GitHub) ── */
let ARTICLES = [];

async function loadArticles() {
  const LOADING = document.getElementById('catalogue-loading');
  const GRID = document.getElementById('catalogue-grid');
  try {
    const res = await fetch('https://raw.githubusercontent.com/Bananeaa/Leser_German/main/articles.json', {cache: 'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    ARTICLES = await res.json();
    // assign color + height from index
    const colors = ['1','2','3'];
    const heights = ['tall','mid','short','mid','tall','short'];
    ARTICLES.forEach((a, i) => {
      a.color = colors[i % 3];
      a.height = heights[i % 6];
    });
  } catch(e) {
    ARTICLES = FALLBACK_ARTICLES;
    if (LOADING) LOADING.textContent = 'Fetch-Fehler: ' + e.message + ' — zeige Beispielartikel.';
    console.error('loadArticles failed:', e);
  }
  if (LOADING) LOADING.hidden = true;
  GRID.innerHTML = '';
  buildShelf();
}

/* ── Fallback articles (shown if fetch fails) ── */

/* ── Persistence ── */
let seenWords = {};
try { const s = localStorage.getItem('leser_seen'); if (s) seenWords = JSON.parse(s); } catch(e) {}
function saveSeenWords() { try { localStorage.setItem('leser_seen', JSON.stringify(seenWords)); } catch(e) {} }
function isRead(id) { try { return !!localStorage.getItem('leser_read_' + id); } catch(e) { return false; } }
function markRead(id) { try { localStorage.setItem('leser_read_' + id, '1'); } catch(e) {} }

function updateCounters() {
  const n = Object.keys(seenWords).length;
  document.getElementById('shelf-word-count').textContent = n;
  const wc = document.getElementById('topbar-word-count');
  if (wc) wc.textContent = n;
}

/* ── Word helpers ── */
function tokenize(text) {
  const tokens = [], re = /([a-zA-ZäöüÄÖÜß\-]+|[^a-zA-ZäöüÄÖÜß\-]+)/g;
  let m; while ((m = re.exec(text)) !== null) tokens.push(m[0]);
  return tokens;
}
function isWord(t) { return /[a-zA-ZäöüÄÖÜß]/.test(t); }
function norm(w) { return w.toLowerCase().replace(/[.,!?;:"""()]/g, ''); }
function lookup(word) {
  const n = norm(word);
  // Check Wiktionary dict first (article-specific), then base grammar dict
  if (WIKT_DICT[n]) return WIKT_DICT[n];
  if (BASE_DICT[n]) return BASE_DICT[n];
  // Try suffix stripping for inflected forms
  for (const sfx of ['en','er','es','em','s','n','te','ten','t','st','ste','sten','stem']) {
    if (n.length - sfx.length < 3) continue;
    const stem = n.slice(0, n.length - sfx.length);
    if (WIKT_DICT[stem]) return WIKT_DICT[stem];
    if (BASE_DICT[stem]) return BASE_DICT[stem];
  }
  return null;
}
function renderWords(text) {
  return tokenize(text).map(t => {
    if (!isWord(t)) return t;
    const entry = lookup(t), n2 = norm(t);
    if (!entry) return t;
    const seen = seenWords[n2] ? ' looked-up' : '';
    return `<span class="word${seen}" data-word="${t}" data-norm="${n2}">${t}</span>`;
  }).join('');
}

/* ── Build shelf ── */
let activeTag = null;

function buildShelf() {
  const grid = document.getElementById('catalogue-grid');
  const filterBar = document.getElementById('tag-filter');

  // Collect unique tags in order of appearance
  const tags = [];
  ARTICLES.forEach(a => { if (a.tag && !tags.includes(a.tag)) tags.push(a.tag); });

  // Build filter chips
  filterBar.innerHTML = '';
  if (tags.length > 1) {
    tags.forEach(tag => {
      const chip = document.createElement('button');
      chip.className = 'tag-chip' + (activeTag === tag ? ' active' : '');
      chip.textContent = tag;
      chip.addEventListener('click', () => {
        activeTag = (activeTag === tag) ? null : tag;
        renderCards();
        filterBar.querySelectorAll('.tag-chip').forEach(c => c.classList.toggle('active', c.textContent === activeTag));
      });
      filterBar.appendChild(chip);
    });
  }

  renderCards();
  updateCounters();
}

function renderCards() {
  const grid = document.getElementById('catalogue-grid');
  grid.innerHTML = '';
  const visible = activeTag ? ARTICLES.filter(a => a.tag === activeTag) : ARTICLES;
  visible.forEach(art => {
    const read = isRead(art.id);
    const card = document.createElement('div');
    card.className = 'cat-card' + (read ? ' read' : '');
    card.dataset.id = art.id;
    card.innerHTML = `
      <div class="cat-date">${art.date}</div>
      <div class="cat-title">${art.title}</div>
      <div class="cat-desc">${art.desc || ''}</div>
      <div class="cat-meta">
        <span class="cat-level">${art.level || 'B1'}</span>
        ${art.tag ? `<span class="cat-tag">${art.tag}</span>` : ''}
      </div>`;
    card.addEventListener('click', () => openArticle(art));
    grid.appendChild(card);
  });
}

/* ── Navigation ── */
function openArticle(art) {
  markRead(art.id);
  document.querySelectorAll(`.book[data-id="${art.id}"], .cat-card[data-id="${art.id}"]`).forEach(el => el.classList.add('read'));
  renderArticle(art);

  const shelf = document.getElementById('shelf-screen');
  const reader = document.getElementById('reader-screen');
  shelf.classList.add('hidden');
  reader.classList.remove('hidden');
  reader.scrollTop = 0;
}

function goBack() {
  const shelf = document.getElementById('shelf-screen');
  const reader = document.getElementById('reader-screen');
  reader.classList.add('hidden');
  shelf.classList.remove('hidden');
  updateCounters();
}

document.getElementById('back-btn').addEventListener('click', goBack);

/* ── Render article ── */
function renderArticle(art) {
  document.getElementById('topbar-title').textContent = art.title;

  // Support both formats:
  // old: paragraphs = [{de:"...", en:"..."}]
  // new: paragraphs = ["..."], translations = ["..."]
  const paras = art.paragraphs.map((p, i) => {
    const de = (typeof p === 'object') ? p.de : p;
    const en = (typeof p === 'object') ? p.en : (art.translations && art.translations[i]) || '';
    return {de, en};
  });

  const bodyHtml = paras.map((p, i) => `
    <div class="para-block">
      <div class="para-german">${renderWords(p.de)}</div>
      <div class="para-translation" data-para="${i}">${p.en}</div>
      <button class="para-trans-toggle" data-para="${i}" aria-pressed="false">↳ Übersetzung</button>
    </div>`).join('');

  document.getElementById('reader-inner').innerHTML = `
    <div class="article-meta">
      <div class="article-eyebrow">Nachrichtenleicht · A1–A2</div>
      <h2 class="article-title">${art.title}</h2>
      <div class="article-date">${art.date}</div>
    </div>
    <div id="trans-bar">
      <label>
        <span class="toggle-switch">
          <input type="checkbox" id="trans-toggle">
          <span class="toggle-track"></span>
          <span class="toggle-thumb"></span>
        </span>
        Alle Übersetzungen zeigen
      </label>
    </div>
    <div class="article-body">${bodyHtml}</div>
    <a class="source-link" href="${art.url}" target="_blank" rel="noopener">Quelle: ${art.source} ↗</a>`;

  document.getElementById('trans-toggle').addEventListener('change', function() {
    const on = this.checked;
    document.querySelectorAll('.para-translation').forEach(el => el.classList.toggle('visible', on));
    document.querySelectorAll('.para-trans-toggle').forEach(btn => btn.classList.toggle('active', on));
  });
}

/* ── Popup ── */
const popup = document.getElementById('popup');
function showPopup(el) {
  const entry = lookup(el.dataset.word);
  if (!entry) return;
  const n2 = el.dataset.norm;
  seenWords[n2] = true; saveSeenWords(); updateCounters();
  el.classList.add('looked-up');
  document.getElementById('popup-word').textContent = el.dataset.word;
  const tagParts = [];
  if (entry.article) tagParts.push(entry.article);
  if (entry.level) tagParts.push(entry.level);
  document.getElementById('popup-article-tag').textContent = tagParts.join(' · ');
  document.getElementById('popup-translation').textContent = entry.en;
  const rect = el.getBoundingClientRect();
  let left = Math.min(rect.left, window.innerWidth - 256);
  left = Math.max(left, 16);
  let top = rect.bottom + 8;
  if (top + 90 > window.innerHeight) top = rect.top - 90;
  popup.style.left = left + 'px'; popup.style.top = top + 'px';
  popup.classList.add('visible');
}
function hidePopup() { popup.classList.remove('visible'); }

document.getElementById('reader-screen').addEventListener('click', e => {
  const toggleBtn = e.target.closest('.para-trans-toggle');
  if (toggleBtn) {
    hidePopup();
    const i = toggleBtn.dataset.para;
    const transEl = document.querySelector(`.para-translation[data-para="${i}"]`);
    const on = !transEl.classList.contains('visible');
    transEl.classList.toggle('visible', on);
    toggleBtn.classList.toggle('active', on);
    toggleBtn.setAttribute('aria-pressed', String(on));
    const all = document.querySelectorAll('.para-translation');
    document.getElementById('trans-toggle').checked = [...all].every(el => el.classList.contains('visible'));
    return;
  }
  const word = e.target.closest('.word');
  if (word) { e.stopPropagation(); showPopup(word); return; }
  if (!popup.contains(e.target)) hidePopup();
});

document.getElementById('popup-close').addEventListener('click', hidePopup);
document.getElementById('reader-screen').addEventListener('scroll', hidePopup, {passive:true});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { hidePopup(); } });

loadArticles();
</script>
